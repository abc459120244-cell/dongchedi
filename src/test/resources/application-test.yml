# 测试环境使用内存数据库，保证每个测试上下文干净且互不干扰
spring:
  datasource:
    url: jdbc:h2:mem:dongchedi-test;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
  h2:
    console:
      enabled: false
