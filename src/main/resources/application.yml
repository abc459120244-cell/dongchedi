server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax

spring:
  application:
    name: dongchedi
  # 默认使用 H2 文件数据库：无需安装数据库即可运行，数据保存在 ./data/dongchedi.mv.db
  # 部署到服务器时用 MySQL：--spring.profiles.active=mysql
  datasource:
    url: jdbc:h2:file:./data/dongchedi;MODE=MySQL;AUTO_SERVER=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  h2:
    console:
      enabled: true
      path: /h2-console
  jackson:
    default-property-inclusion: non_null
    serialization:
      indent-output: false
  web:
    resources:
      static-locations: classpath:/static/
      cache:
        period: 0
  mvc:
    problemdetails:
      enabled: false

# 业务配置：数据集路径与推荐算法默认参数
dongchedi:
  dataset:
    location: classpath:data/cars.json
  recommend:
    default-limit: 5
    max-limit: 20
  auth:
    # 连续登录失败次数达到该值后按用户名临时锁定
    max-failed-attempts: 5
    lock-duration: 5m
    # 演示账号：启动时用 BCrypt 哈希后写入内存用户仓库
    seed-users:
      - username: demo
        password: demo123
        nickname: 演示用户
        role: USER
        favorites: [1, 6, 16]
      - username: admin
        password: admin123
        nickname: 系统管理员
        role: ADMIN
      # 商家账号：登录商家端 /merchant.html 可以管理车源与订单
      - username: dealer_byd
        password: dealer123
        nickname: 比亚迪新能源旗舰店
        role: MERCHANT
      - username: dealer_ev
        password: dealer123
        nickname: 新势力体验中心
        role: MERCHANT
      - username: dealer_intl
        password: dealer123
        nickname: 德系日系联合展厅
        role: MERCHANT

logging:
  level:
    root: INFO
    com.dongchedi.car: DEBUG
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n"
