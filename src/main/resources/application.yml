server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax

spring:
  application:
    name: dongchedi
  jackson:
    default-property-inclusion: non_null
    serialization:
      indent-output: false
  web:
    resources:
      static-locations: classpath:/static/
      cache:
        period: 0
  mvc:
    problemdetails:
      enabled: false

# 业务配置：数据集路径与推荐算法默认参数
dongchedi:
  dataset:
    location: classpath:data/cars.json
  recommend:
    default-limit: 5
    max-limit: 20
  auth:
    # 连续登录失败次数达到该值后按用户名临时锁定
    max-failed-attempts: 5
    lock-duration: 5m
    # 演示账号：启动时用 BCrypt 哈希后写入内存用户仓库
    seed-users:
      - username: demo
        password: demo123
        nickname: 演示用户
        role: USER
        favorites: [1, 6, 16]
      - username: admin
        password: admin123
        nickname: 系统管理员
        role: ADMIN

logging:
  level:
    root: INFO
    com.dongchedi.car: DEBUG
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n"
