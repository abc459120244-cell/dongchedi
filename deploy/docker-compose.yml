# 一键部署：MySQL 8 + 应用 + Nginx
# 使用方式（在项目根目录执行）：
#   docker compose -f deploy/docker-compose.yml up -d --build
# 访问：http://服务器IP/
services:
  mysql:
    image: mysql:8.0
    container_name: dongchedi-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: dongchedi123
      MYSQL_DATABASE: dongchedi
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-pdongchedi123"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [dongchedi-net]

  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: dongchedi-app
    restart: always
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: dongchedi
      DB_USER: root
      DB_PASSWORD: dongchedi123
      SPRING_PROFILES_ACTIVE: mysql
      TZ: Asia/Shanghai
    depends_on:
      mysql:
        condition: service_healthy
    networks: [dongchedi-net]

  nginx:
    image: nginx:1.25-alpine
    container_name: dongchedi-nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks: [dongchedi-net]

volumes:
  mysql-data:

networks:
  dongchedi-net:
